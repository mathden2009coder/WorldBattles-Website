plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = 'com.worldbattles.factions'
version = '0.1.0'
base { archivesName = 'worldbattles-factions' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
  mappings channel: 'official', version: '1.20.1'
  runs {
    client { workingDirectory project.file('run') }
    server { workingDirectory project.file('run') }
  }
}
repositories { mavenCentral() }
dependencies {
  minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
  compileOnly files('../worldbattles-shop/build/libs/worldbattles-shop-0.2.2.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
