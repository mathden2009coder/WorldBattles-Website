name: Build WorldBattles Shop (Forge 1.20.1)

on:
  push:
    branches:
      - feature/worldbattles-shop
    paths:
      - 'mods/worldbattles-shop/**'
      - '.github/workflows/build-worldbattles-shop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mods/worldbattles-shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        run: python3 tests/test_invariants.py
      - name: Compile Forge mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: worldbattles-shop-forge-1.20.1
          path: mods/worldbattles-shop/build/libs/worldbattles-shop-0.2.0.jar
          if-no-files-found: error
