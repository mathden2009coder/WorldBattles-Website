name: Build WorldBattles Lobby PvP
on:
  push:
    branches: [dev/worldbattles-lobby-pvp]
    paths:
      - 'dev/worldbattles-lobby-pvp/**'
      - '.github/workflows/build-worldbattles-lobby-pvp.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge 1.20.1
        working-directory: dev/worldbattles-lobby-pvp
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: worldbattles-lobby-pvp-0.1.0
          path: dev/worldbattles-lobby-pvp/build/libs/*.jar
          if-no-files-found: error
