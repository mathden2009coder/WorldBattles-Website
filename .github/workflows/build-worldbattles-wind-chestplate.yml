name: Build WorldBattles Plastron du Vent
on:
  push:
    branches: [dev/worldbattles-wind-chestplate]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate item and armor textures
        working-directory: dev/worldbattles-wind-chestplate
        run: python3 generate_textures.py
      - name: Compile Forge mod
        working-directory: dev/worldbattles-wind-chestplate
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: worldbattles-wind-chestplate-0.1.4-ALPHA
          path: dev/worldbattles-wind-chestplate/build/libs/*.jar
          if-no-files-found: error
