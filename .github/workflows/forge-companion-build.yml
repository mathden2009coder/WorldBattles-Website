name: Forge Companion Build
on:
  workflow_dispatch:
  push:
    branches: [forge-companion-build]
    paths: ['companion/**', '.github/workflows/forge-companion-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WorldBattles-Companion-Forge-1.20.1
          path: companion/build/libs/*.jar
          if-no-files-found: error
