name: Build WorldBattles Spawn Exit
on:
  push:
    branches: [dev/worldbattles-spawn-exit]
    paths:
      - 'dev/worldbattles-spawn-exit/**'
      - '.github/workflows/build-worldbattles-spawn-exit.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge 1.20.1
        working-directory: dev/worldbattles-spawn-exit
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: worldbattles-spawn-exit-0.1.0-ALPHA
          path: dev/worldbattles-spawn-exit/build/libs/*.jar
          if-no-files-found: error
