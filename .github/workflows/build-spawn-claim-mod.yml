name: Build WorldBattles Spawn Claim Interactions
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-spawn-claim-mod.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Forge mod JAR
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: WorldBattles-Spawn-Claim-Interactions-1.20.1-1.0.1
          path: build/libs/*.jar
          if-no-files-found: error