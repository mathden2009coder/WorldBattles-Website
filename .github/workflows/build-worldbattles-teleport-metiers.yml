name: Build WorldBattles Teleportation et Pause Metiers (Forge 1.20.1)

on:
  push:
    branches:
      - feature/worldbattles-teleport-metiers
    paths:
      - 'mods/worldbattles-teleport-metiers/**'
      - '.github/workflows/build-worldbattles-teleport-metiers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mods/worldbattles-teleport-metiers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate teleportation and pause rules
        run: python3 tests/test_contract.py
      - name: Compile Forge server mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: worldbattles-teleport-metiers-1.0.0-forge-1.20.1
          path: mods/worldbattles-teleport-metiers/build/libs/worldbattles-teleport-metiers-1.0.0.jar
          if-no-files-found: error
