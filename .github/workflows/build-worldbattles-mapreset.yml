name: Build WorldBattles MapReset Forge
on:
  push:
    branches: [dev/worldbattles-mapreset]
    paths:
      - 'dev/worldbattles-mapreset/**'
      - '.github/workflows/build-worldbattles-mapreset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge 1.20.1
        working-directory: dev/worldbattles-mapreset
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: worldbattles-mapreset-0.1.0-ALPHA
          path: dev/worldbattles-mapreset/build/libs/*.jar
          if-no-files-found: error
