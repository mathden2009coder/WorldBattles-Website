name: Arenas 0.3.4 One Minute Wait
on:
  push:
    branches: [arenas-wb-sandwars-60s-min2]
    paths: ['arenas/**', '.github/workflows/arenas-one-minute.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arenas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WorldBattles-Arenas-0.3.4-Forge-1.20.1
          path: arenas/build/libs/*.jar
          if-no-files-found: error
