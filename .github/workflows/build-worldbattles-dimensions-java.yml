name: Build WorldBattles Dimensions Java
on:
  push:
    branches: [dev/dimensions-portal-axis-fix]
    paths:
      - 'dev/worldbattles-dimensions-java/**'
      - '.github/workflows/build-worldbattles-dimensions-java.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge 1.20.1
        working-directory: dev/worldbattles-dimensions-java
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: worldbattles-dimensions-java-0.2.0-alpha
          path: dev/worldbattles-dimensions-java/build/libs/*.jar
          if-no-files-found: error
