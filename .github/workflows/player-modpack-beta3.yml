name: Build WorldBattles Player Pack BETA3
on:
  workflow_dispatch:
  push:
    branches: [player-modpack-beta3-dev]
    paths:
      - 'scripts/rebuild_player_pack_beta3.py'
      - '.github/workflows/player-modpack-beta3.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout updated Arenas source and pack script
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile verified Arenas 0.3.2
        working-directory: arenas
        run: |
          gradle build --no-daemon
          ls -lh build/libs/
      - name: Download published BETA 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input output
          gh release download beta-2 --repo "${{ github.repository }}" --pattern "WorldBattles_Modpack_Player_BETA2_Forge_1.20.1.zip" --dir input
          ls -lh input/
      - name: Prepare and validate BETA 3
        run: |
          python scripts/rebuild_player_pack_beta3.py \
            input/WorldBattles_Modpack_Player_BETA2_Forge_1.20.1.zip \
            arenas/build/libs/worldbattles-arenas-0.3.2-sandwars-waiting-spawn.jar \
            output/WorldBattles_Modpack_Player_BETA3_Forge_1.20.1.zip \
            output/verification.json
      - name: Upload complete modpack
        uses: actions/upload-artifact@v4
        with:
          name: WorldBattles-Modpack-Player-BETA3-Forge-1.20.1
          path: output/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
