name: Build WorldBattles Weapon Distributor

on:
  push:
    branches:
      - weapon-distributor-build
    paths:
      - 'tools/weapon-distributor/BUILD_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        working-directory: tools/weapon-distributor
        run: gradle --no-daemon clean build

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: worldbattles-weapon-distributor-test
          path: tools/weapon-distributor/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
