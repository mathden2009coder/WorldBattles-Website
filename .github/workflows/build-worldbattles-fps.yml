name: Build WorldBattles FPS
on:
  push:
    paths:
      - 'WorldBattles-FPS/**'
      - '.github/workflows/build-worldbattles-fps.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge mod
        working-directory: WorldBattles-FPS
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldBattles-FPS-Forge-1.20.1
          path: WorldBattles-FPS/build/libs/*.jar
          if-no-files-found: error
