plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.worldbattles'
version = '1.0.1'
archivesBaseName = 'WorldBattles-Spawn-Claim-Interactions-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { worldbattlesclaiminteract { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
jar {
    manifest { attributes(['Specification-Title': 'worldbattlesclaiminteract', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.version]) }
}
jar.finalizedBy('reobfJar')